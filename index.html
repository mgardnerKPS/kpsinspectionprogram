<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>KPS Field Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{
  --navy:#132A45;
  --navy-2:#1E3E63;
  --orange:#E8622C;
  --orange-dark:#C94F1F;
  --bg:#F2F4F6;
  --card:#FFFFFF;
  --line:#DCE1E7;
  --ink:#152233;
  --sub:#5C6B7A;
  --green:#2F9E44;
  --red:#D9333F;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;}
 
/* Header */
.topbar{background:var(--navy);color:#fff;padding:16px 18px;display:flex;
  align-items:center;gap:12px;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar .back{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);
  border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
.topbar h1{font-size:22px;font-weight:700;margin:0;line-height:1;flex:1;}
.topbar .stripe{position:absolute;left:0;bottom:0;height:4px;width:100%;
  background:repeating-linear-gradient(45deg,var(--orange) 0 10px,transparent 10px 20px);opacity:.5;}
.crumbs{font-size:12px;color:#B9C6D4;margin-top:2px;}
.acct-btn{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:11px;font-weight:600;
  padding:7px 10px;border-radius:8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;}
.acct-btn.signed-in{background:rgba(47,158,68,.35);}
 
.content{flex:1;padding:18px 16px 100px;}
 
/* Type grid */
.type-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px;}
.type-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  box-shadow:0 1px 2px rgba(20,30,45,.05);transition:transform .12s, box-shadow .12s;}
.type-card:active{transform:scale(.98);}
.type-card .num{font-family:'Barlow Condensed';font-size:28px;font-weight:700;color:var(--orange);
  width:38px;text-align:center;}
.type-card .txt h3{margin:0 0 2px;font-size:19px;}
.type-card .txt p{margin:0;font-size:13px;color:var(--sub);}
.type-card .chev{margin-left:auto;color:var(--sub);font-size:20px;}
 
/* Cards / sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:18px;color:var(--navy);}
label{display:block;font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;
  letter-spacing:.04em;margin:12px 0 5px;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
input.invalid,textarea.invalid{border-color:var(--red);}
textarea{resize:vertical;min-height:70px;}
.hint{font-size:11px;color:var(--sub);margin-top:4px;}
.hint.err{color:var(--red);font-weight:600;}
 
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:11px;font-size:15px;font-weight:600;padding:13px 18px;
  cursor:pointer;width:100%;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:active{background:var(--orange-dark);}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.btn-ghost{background:transparent;color:var(--navy-2);border:1.5px dashed var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
 
/* Yes/No toggle */
.yn{display:flex;gap:10px;margin-top:2px;}
.yn button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-weight:600;font-size:14px;color:var(--sub);}
.yn button.active-yes{background:var(--green);border-color:var(--green);color:#fff;}
.yn button.active-no{background:var(--sub);border-color:var(--sub);color:#fff;}
 
/* Photo grid */
.photo-req{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;}
.photo-req .cnt{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EDEFF2;color:var(--sub);}
.photo-req .cnt.ok{background:#E6F6EA;color:var(--green);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#EDEFF2;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(20,20,20,.65);color:#fff;border:none;font-size:12px;line-height:20px;padding:0;}
.photo-add{aspect-ratio:1;border-radius:9px;border:1.5px dashed var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);
  font-size:11px;gap:4px;cursor:pointer;}
.photo-add span.plus{font-size:22px;line-height:1;color:var(--orange);}
 
/* List rows (buildings / units / punchlist items) */
.row-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.row-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  display:flex;align-items:center;gap:10px;}
.row-item .badge{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;
  font-family:'Barlow Condensed';font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
.row-item .info{flex:1;}
.row-item .info .t{font-weight:600;font-size:14.5px;}
.row-item .info .s{font-size:12px;color:var(--sub);}
.row-item .st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.st.done{background:#E6F6EA;color:var(--green);}
.st.pending{background:#FBEEE9;color:var(--orange-dark);}
 
.section-div{height:1px;background:var(--line);margin:16px 0;}
 
/* Sticky bottom bar */
.bottombar{position:sticky;bottom:0;background:var(--bg);padding:12px 16px 18px;
  box-shadow:0 -6px 14px rgba(20,30,45,.06);}
 
.progress-track{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden;}
.progress-fill{height:100%;background:var(--orange);border-radius:3px;transition:width .2s;}
 
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);
  color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  z-index:200;max-width:88%;text-align:center;}
 
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.checkbox-item{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:13.5px;}
.checkbox-item input{width:16px;height:16px;}
 
.pill-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.pill{padding:8px 13px;border-radius:20px;font-size:13px;font-weight:600;background:#fff;
  border:1.5px solid var(--line);color:var(--sub);}
.pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
 
.empty{text-align:center;padding:30px 10px;color:var(--sub);font-size:13.5px;}
 
.sig-pad{border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:150px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   KPS FIELD INSPECTION APP — single-file build
   Inspection types: Precon Exterior, Precon Interior, Daily Progress,
   Punchlist, Final / End of Project
   ========================================================================= */
 
const STATE = {
  screen:'home',           // home | subtype | header | session | report
  inspectionType:null,     // 'exterior' | 'interior' | 'daily' | 'punch' | 'final'
  subType:null,            // roofing|siding|decks|painting|carpentry
  header:{property:'',address:'',contact:'',po:'',date:'',name:''},
  buildings:[],            // exterior / daily / punch / final
  units:[],                // interior
  activeIndex:null,        // which building/unit is open
  toast:null
};
 
const SIDE_SETS = {
  standard:['Front side','Left side','Rear side','Right side'],
  deck:['Front side of deck','Left side of deck','Underside','Right side of deck']
};
 
const SUBTYPES = [
  {key:'roofing',label:'Roofing'},
  {key:'siding',label:'Siding'},
  {key:'decks',label:'Decks'},
  {key:'painting',label:'Painting'},
  {key:'carpentry',label:'Carpentry / Other'}
];
 
const INSPECTION_TYPES = [
  {key:'exterior',label:'Precon Exterior',desc:'Roofing, siding, decks, painting, carpentry'},
  {key:'interior',label:'Precon Interior',desc:'Per-unit ceiling & condition documentation'},
  {key:'daily',label:'Daily Progress',desc:'Daily work log, rot found, inspections'},
  {key:'punch',label:'Punchlist',desc:'Punchlist item completion documentation'},
  {key:'final',label:'Final — End of Project',desc:'Closeout documentation & final inspections'}
];
 
function uid(){return Math.random().toString(36).slice(2,10);}
 
/* ---------- building/unit factory per inspection type ---------- */
function newBuilding(type, subType){
  const sides = subType==='decks' ? SIDE_SETS.deck : SIDE_SETS.standard;
  const b = {id:uid(), name:'', sides:{}, };
  sides.forEach(s=> b.sides[s] = {photos:[]});
  if(type==='exterior'){
    b.acUnit=null; b.acPhotos=[];
    if(subType==='decks'){
      b.sliderScreen=null; b.sliderPhotos=[];
      b.grillFurniture=null; b.grillPhotos=[];
    } else {
      b.rippedScreen=null; b.rippedQty=0; b.rippedPhotos=[];
    }
    b.existingDamage=''; b.damagePhotos=[];
  }
  if(type==='daily'){
    b.workDesc=''; b.rotFound=null; b.rotDesc=''; b.rotUnit=''; b.rotLocation='';
    b.rotPhotos=[]; b.allowance={plywood:false,framing:false,insulation:false,other:false};
    b.progressNotes=''; b.inspectionsToday=null; b.inspType=''; b.inspResult='';
  }
  if(type==='punch'){
    b.items=[]; // {id, desc, photos:[]}
  }
  if(type==='final'){
    b.workDesc=''; b.materialsRemoved=null; b.dumpstersRemoved=null;
    b.finalInsp=null; b.finalDate=''; b.finalResult=''; b.scheduledFor='';
  }
  return b;
}
function newUnit(){
  return {id:uid(), name:'', ceilingPhotos:[], stains:[]}; // stains: [{photos:[]}]
}
 
/* ---------- rendering helpers ---------- */
function el(html){const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild;}
function app(){return document.getElementById('app');}
function render(){
  app().innerHTML='';
  app().appendChild(buildTopbar());
  const content = el(`<div class="content"></div>`);
  app().appendChild(content);
  content.appendChild(buildScreen());
  if(STATE.toast){
    const t = el(`<div class="toast">${STATE.toast}</div>`);
    document.body.appendChild(t);
    setTimeout(()=>{t.remove(); STATE.toast=null;}, 2200);
  }
}
function showToast(msg){ STATE.toast=msg; const t=el(`<div class="toast">${msg}</div>`); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
 
function buildTopbar(){
  const titles = {
    home:'KPS Field Inspection', subtype:'Precon Exterior', header:'Job Info', session:sessionTitle(), report:'Report'
  };
  const showBack = STATE.screen!=='home';
  const bar = el(`
    <div class="topbar">
      ${showBack?`<button class="back" onclick="goBack()">&#8592;</button>`:''}
      <div style="flex:1">
        <h1>${titles[STATE.screen] || 'KPS Field Inspection'}</h1>
        <div class="crumbs">${crumbText()}</div>
      </div>
      <button class="acct-btn ${graphAccount?'signed-in':''}" onclick="onAcctBtn()">${graphAccount? (graphAccount.username||'Signed in') : 'Sign in'}</button>
      <div class="stripe"></div>
    </div>`);
  return bar;
}
function onAcctBtn(){
  if(graphAccount){ showToast('Signed in as '+graphAccount.username); }
  else { signInMsGraph(); }
}
function sessionTitle(){
  const t = INSPECTION_TYPES.find(t=>t.key===STATE.inspectionType);
  return t? t.label : 'Session';
}
function crumbText(){
  const parts=[];
  if(STATE.inspectionType) parts.push(sessionTitle());
  if(STATE.subType) parts.push(SUBTYPES.find(s=>s.key===STATE.subType)?.label);
  if(STATE.header.property) parts.push(STATE.header.property);
  return parts.join(' / ');
}
function goBack(){
  if(STATE.screen==='report'){ STATE.screen='session'; }
  else if(STATE.screen==='session'){ STATE.screen = STATE.inspectionType==='exterior' ? 'subtype':'home'; STATE.header={property:'',address:'',contact:'',po:'',date:'',name:''}; STATE.buildings=[]; STATE.units=[]; }
  else if(STATE.screen==='header'){ STATE.screen = STATE.inspectionType==='exterior' ? 'subtype':'home'; }
  else if(STATE.screen==='subtype'){ STATE.screen='home'; STATE.inspectionType=null; }
  render();
}
 
function buildScreen(){
  switch(STATE.screen){
    case 'home': return screenHome();
    case 'subtype': return screenSubtype();
    case 'header': return screenHeader();
    case 'session': return screenSession();
    default: return screenHome();
  }
}
 
/* ---------------- HOME ---------------- */
function screenHome(){
  const wrap = el(`<div></div>`);
  const grid = el(`<div class="type-grid"></div>`);
  INSPECTION_TYPES.forEach((t,i)=>{
    const card = el(`
      <div class="type-card" onclick="selectType('${t.key}')">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="txt"><h3>${t.label}</h3><p>${t.desc}</p></div>
        <div class="chev">&#8250;</div>
      </div>`);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}
function selectType(key){
  STATE.inspectionType=key;
  STATE.buildings=[]; STATE.units=[];
  STATE.screen = key==='exterior' ? 'subtype' : 'header';
  render();
}
 
/* ---------------- SUBTYPE (exterior only) ---------------- */
function screenSubtype(){
  const wrap = el(`<div></div>`);
  const grid = el(`<div class="type-grid"></div>`);
  SUBTYPES.forEach(s=>{
    grid.appendChild(el(`
      <div class="type-card" onclick="selectSubtype('${s.key}')">
        <div class="txt" style="flex:1"><h3>${s.label}</h3></div>
        <div class="chev">&#8250;</div>
      </div>`));
  });
  wrap.appendChild(grid);
  return wrap;
}
function selectSubtype(key){ STATE.subType=key; STATE.screen='header'; render(); }
 
/* ---------------- HEADER (mandatory job info) ---------------- */
function screenHeader(){
  const h = STATE.header;
  const wrap = el(`
    <div>
      <div class="card">
        <h3>Property / Job Information</h3>
        <label>Property Name *</label>
        <input type="text" id="f_property" value="${h.property}">
        <label>Address *</label>
        <input type="text" id="f_address" value="${h.address}">
        <label>Contact *</label>
        <input type="text" id="f_contact" value="${h.contact}">
        <label>PO # *</label>
        <input type="text" id="f_po" value="${h.po}">
        <label>Date *</label>
        <input type="date" id="f_date" value="${h.date}">
        <label>Inspector Name *</label>
        <input type="text" id="f_name" value="${h.name}">
        <div class="hint">All fields are required to continue.</div>
      </div>
    </div>`);
  const bar = el(`<div class="bottombar"><button class="btn btn-primary" onclick="submitHeader()">Continue</button></div>`);
  wrap.appendChild(bar);
  return wrap;
}
function submitHeader(){
  const ids=['property','address','contact','po','date','name'];
  let ok=true;
  ids.forEach(id=>{
    const inp=document.getElementById('f_'+id);
    const val=inp.value.trim();
    STATE.header[id]=val;
    if(!val){ inp.classList.add('invalid'); ok=false; } else inp.classList.remove('invalid');
  });
  if(!ok){ showToast('Please complete all required fields.'); return; }
  STATE.screen='session';
  render();
}
 
/* ---------------- SESSION (main flow, branches by type) ---------------- */
function screenSession(){
  const type=STATE.inspectionType;
  if(type==='interior') return sessionInterior();
  if(type==='punch') return sessionPunch();
  return sessionBuildingBased(); // exterior, daily, final all use "Add Building"
}
 
/* ----- generic building list screen (exterior / daily / final) ----- */
function sessionBuildingBased(){
  const wrap = el(`<div></div>`);
  const list = el(`<div class="row-list"></div>`);
  if(STATE.buildings.length===0){
    list.appendChild(el(`<div class="empty">No buildings added yet.<br>Tap "Add Building" to begin.</div>`));
  }
  STATE.buildings.forEach((b,i)=>{
    const complete = buildingComplete(b);
    list.appendChild(el(`
      <div class="row-item" onclick="openBuilding(${i})">
        <div class="badge">${i+1}</div>
        <div class="info">
          <div class="t">${b.name || 'Building '+(i+1)}</div>
          <div class="s">${complete? 'Documentation complete':'In progress'}</div>
        </div>
        <div class="st ${complete?'done':'pending'}">${complete?'Done':'Open'}</div>
      </div>`));
  });
  wrap.appendChild(list);
  const bar = el(`
    <div class="bottombar">
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="addBuilding()">+ Add Building</button>
        <button class="btn btn-secondary" ${STATE.buildings.length===0?'disabled':''} onclick="generateReport()">Download PDF</button>
      </div>
      <div style="height:8px"></div>
      <button class="btn btn-primary" ${STATE.buildings.length===0?'disabled':''} onclick="saveToOneDrive()">&#9729; Save to OneDrive</button>
    </div>`);
  wrap.appendChild(bar);
  return wrap;
}
function addBuilding(){
  const b = newBuilding(STATE.inspectionType, STATE.subType);
  b.name = 'Building '+(STATE.buildings.length+1);
  STATE.buildings.push(b);
  STATE.activeIndex = STATE.buildings.length-1;
  renderBuildingDetail();
}
function openBuilding(i){ STATE.activeIndex=i; renderBuildingDetail(); }
 
function buildingComplete(b){
  if(STATE.inspectionType==='exterior') return exteriorComplete(b);
  if(STATE.inspectionType==='daily') return dailyComplete(b);
  if(STATE.inspectionType==='final') return finalComplete(b);
  return false;
}
function exteriorComplete(b){
  const sidesOk = Object.values(b.sides).every(s=>s.photos.length>=5);
  const acOk = b.acUnit!==null && (b.acUnit==='no' || b.acPhotos.length>=1);
  let screenOk;
  if(STATE.subType==='decks'){
    screenOk = b.sliderScreen!==null && ((b.sliderScreen==='yes'&&b.sliderPhotos.length>=1)||(b.sliderScreen==='no'&&b.sliderPhotos.length>=1));
    const grillOk = b.grillFurniture!==null && (b.grillFurniture==='no' || b.grillPhotos.length>=1);
    screenOk = screenOk && grillOk;
  } else {
    screenOk = b.rippedScreen!==null && (b.rippedScreen==='no' || (b.rippedQty>0 && b.rippedPhotos.length>=b.rippedQty));
  }
  const dmgOk = b.existingDamage.trim().length>0;
  return sidesOk && acOk && screenOk && dmgOk;
}
function dailyComplete(b){
  const sidesOk = Object.values(b.sides).every(s=>s.photos.length>=5);
  const rotOk = b.rotFound!==null && (b.rotFound==='no' || (b.rotDesc && b.rotUnit && b.rotLocation && b.rotPhotos.length>=5));
  const progressOk = b.progressNotes.trim().length>=30;
  const inspOk = b.inspectionsToday!==null && (b.inspectionsToday==='no' || (b.inspType && b.inspResult));
  return b.workDesc.trim().length>0 && sidesOk && rotOk && progressOk && inspOk;
}
function finalComplete(b){
  const sidesOk = Object.values(b.sides).every(s=>s.photos.length>=5);
  const matOk = b.materialsRemoved!==null;
  const dumpOk = b.dumpstersRemoved!==null;
  const inspOk = b.finalInsp!==null && (b.finalInsp==='yes' ? (b.finalDate && b.finalResult) : b.scheduledFor.trim().length>0);
  return b.workDesc.trim().length>0 && sidesOk && matOk && dumpOk && inspOk;
}
 
/* ----- building detail (routes to the right form by type) ----- */
function renderBuildingDetail(){
  STATE.screen='session-detail';
  render();
}
function buildScreenOverride(){}
</script>
<script>
/* Override buildScreen to add the detail view without redeclaring above */
const _origBuildScreen = buildScreen;
buildScreen = function(){
  if(STATE.screen==='session-detail'){
    const b = STATE.buildings[STATE.activeIndex];
    if(STATE.inspectionType==='exterior') return exteriorDetail(b);
    if(STATE.inspectionType==='daily') return dailyDetail(b);
    if(STATE.inspectionType==='final') return finalDetail(b);
  }
  if(STATE.screen==='unit-detail'){
    return interiorUnitDetail(STATE.units[STATE.activeIndex]);
  }
  if(STATE.screen==='punch-detail'){
    return punchBuildingDetail(STATE.buildings[STATE.activeIndex]);
  }
  return _origBuildScreen();
};
const _origGoBack = goBack;
goBack = function(){
  if(['session-detail','unit-detail','punch-detail'].includes(STATE.screen)){
    STATE.screen='session'; STATE.activeIndex=null; render(); return;
  }
  _origGoBack();
};
</script>
<script>
/* ---------------- PHOTO WIDGET ---------------- */
function photoInputId(){ return 'ph_'+uid(); }
function renderPhotoBlock(labelText, photosArr, minCount, onChangeCb){
  const id = photoInputId();
  const need = Math.max(0, minCount-photosArr.length);
  const block = el(`
    <div>
      <div class="photo-req">
        <label style="margin:0">${labelText}</label>
        <span class="cnt ${photosArr.length>=minCount?'ok':''}">${photosArr.length}/${minCount}</span>
      </div>
      <div class="photo-grid" id="grid_${id}"></div>
    </div>`);
  const grid = block.querySelector(`#grid_${id}`);
  photosArr.forEach((src,idx)=>{
    const th = el(`<div class="photo-thumb"><img src="${src}"><button class="rm">&times;</button></div>`);
    th.querySelector('.rm').onclick=(e)=>{ e.stopPropagation(); photosArr.splice(idx,1); onChangeCb(); };
    grid.appendChild(th);
  });
  const addTile = el(`
    <label class="photo-add">
      <span class="plus">+</span>Add photo
      <input type="file" accept="image/*" capture="environment" style="display:none">
    </label>`);
  const input = addTile.querySelector('input');
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ photosArr.push(reader.result); onChangeCb(); };
    reader.readAsDataURL(file);
  });
  grid.appendChild(addTile);
  return block;
}
function ynRow(current, onYes, onNo){
  const row = el(`<div class="yn">
      <button type="button" class="${current==='yes'?'active-yes':''}">Yes</button>
      <button type="button" class="${current==='no'?'active-no':''}">No</button>
    </div>`);

  row.children[1].onclick=onNo;

}

<script>
/* ---------------- PDF REPORT GENERATION ---------------- */
function makeDocContext(doc){
  const marginX = 40; const ctx = {y:50};
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  ctx.ensureSpace = (h)=>{ if(ctx.y+h > pageH-50){ doc.addPage(); ctx.y=50; } };
  ctx.heading = (text, size=16)=>{
    ctx.ensureSpace(30);
    doc.setFont('helvetica','bold'); doc.setFontSize(size); doc.setTextColor(19,42,69);
    doc.text(text, marginX, ctx.y); ctx.y+=size+8;
    doc.setDrawColor(220,225,231); doc.line(marginX,ctx.y-4,pageW-marginX,ctx.y-4); ctx.y+=4;
  };
  ctx.line = (label, value)=>{
    ctx.ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(90,100,110);
    doc.text(label+':', marginX, ctx.y);
    doc.setFont('helvetica','normal'); doc.setTextColor(20,30,40);
    const val = value===null||value===undefined||value==='' ? '—' : String(value);
    doc.text(val, marginX+120, ctx.y);
    ctx.y+=15;
  };
  ctx.paragraph = (label, text)=>{
    ctx.ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(90,100,110);
    doc.text(label+':', marginX, ctx.y); ctx.y+=13;
    doc.setFont('helvetica','normal'); doc.setTextColor(20,30,40);
    const split = doc.splitTextToSize(text||'—', pageW-marginX*2);
    ctx.ensureSpace(split.length*12);
    doc.text(split, marginX, ctx.y); ctx.y+= split.length*12+6;
  };
  ctx.photoGrid = (label, photos)=>{
    if(!photos || photos.length===0) return;
    ctx.ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(90,100,110);
    doc.text(label+` (${photos.length})`, marginX, ctx.y); ctx.y+=10;
    const cols=3, size=140, gap=10;
    let col=0;
    photos.forEach(src=>{
      ctx.ensureSpace(size+10);
      const x = marginX + col*(size+gap);
      try{ doc.addImage(src, 'JPEG', x, ctx.y, size, size*0.75); }catch(e){}
      col++;
      if(col>=cols){ col=0; ctx.y+=size*0.75+gap; }
    });
    if(col!==0) ctx.y+=size*0.75+gap;
  };
  ctx.marginX = marginX;
  return ctx;
}
function renderHeaderBlock(doc, ctx){
  ctx.heading('KPS Field Inspection Report', 20);
  const t = INSPECTION_TYPES.find(t=>t.key===STATE.inspectionType);
  ctx.line('Inspection Type', t?t.label:'—');
  if(STATE.subType) ctx.line('Category', SUBTYPES.find(s=>s.key===STATE.subType)?.label);
  ctx.line('Property', STATE.header.property);
  ctx.line('Address', STATE.header.address);
  ctx.line('Contact', STATE.header.contact);
  ctx.line('PO #', STATE.header.po);
  ctx.line('Date', STATE.header.date);
  ctx.line('Inspector', STATE.header.name);
  ctx.y+=6;
}
function renderExterior(doc, ctx, b, label){
  doc.addPage(); ctx.y=50;
  ctx.heading(label, 16);
  Object.keys(b.sides).forEach(side=>{ ctx.photoGrid(side, b.sides[side].photos); });
  ctx.line('AC Unit Present', b.acUnit); ctx.photoGrid('AC unit photo', b.acPhotos);
  if(STATE.subType==='decks'){
    ctx.line('Slider Screen', b.sliderScreen); ctx.photoGrid('Slider screen photo', b.sliderPhotos);
    ctx.line('Grill / Deck Furniture', b.grillFurniture); ctx.photoGrid('Grill/furniture photo', b.grillPhotos);
  } else {
    ctx.line('Ripped Screen', b.rippedScreen);
    if(b.rippedScreen==='yes') ctx.line('Quantity', b.rippedQty);
    ctx.photoGrid('Screen photos', b.rippedPhotos);
  }
  ctx.paragraph('Existing Damage', b.existingDamage); ctx.photoGrid('Damage photos', b.damagePhotos);
}
function renderDaily(doc, ctx, b, label){
  doc.addPage(); ctx.y=50;
  ctx.heading(label, 16);
  Object.keys(b.sides).forEach(side=>{ ctx.photoGrid(side, b.sides[side].photos); });
  ctx.paragraph('Work In Progress Today', b.workDesc);
  ctx.line('Rot Found Today', b.rotFound);
  if(b.rotFound==='yes'){
    ctx.paragraph('Rot Description', b.rotDesc);
    ctx.line('Unit Number', b.rotUnit); ctx.line('Location', b.rotLocation);
    const allow = Object.entries(b.allowance).filter(([k,v])=>v).map(([k])=>k).join(', ');
    ctx.line('Allowance Items Used', allow||'—');
    ctx.photoGrid('Rot photos', b.rotPhotos);
  }
  ctx.paragraph('Progress Made Today', b.progressNotes);
  ctx.line('Inspections Today', b.inspectionsToday);
  if(b.inspectionsToday==='yes'){ ctx.line('Inspection Type', b.inspType); ctx.line('Result', b.inspResult); }
}
function renderFinal(doc, ctx, b, label){
  doc.addPage(); ctx.y=50;
  ctx.heading(label, 16);
  Object.keys(b.sides).forEach(side=>{ ctx.photoGrid(side, b.sides[side].photos); });
  ctx.paragraph('Work Completed', b.workDesc);
  ctx.line('All Materials Removed', b.materialsRemoved);
  ctx.line('Dumpsters/Bathrooms/Mobilization Removed', b.dumpstersRemoved);
  ctx.line('Final Inspection', b.finalInsp);
  if(b.finalInsp==='yes'){ ctx.line('Date', b.finalDate); ctx.line('Result', b.finalResult); }
  else { ctx.line('Scheduled For', b.scheduledFor); }
}
function renderInterior(doc, ctx, u, label){
  doc.addPage(); ctx.y=50;
  ctx.heading(label, 16);
  ctx.photoGrid('Ceiling photos', u.ceilingPhotos);
  u.stains.forEach((s,idx)=>{ ctx.photoGrid(`Existing stain/damage #${idx+1}`, s.photos); });
}
function renderPunch(doc, ctx, b, label){
  doc.addPage(); ctx.y=50;
  ctx.heading(label, 16);
  b.items.forEach((it,idx)=>{
    ctx.paragraph(`Punchlist Item #${idx+1}`, it.desc);
    ctx.photoGrid('Photos', it.photos);
  });
}
const ENTITY_RENDERERS = {exterior:renderExterior, daily:renderDaily, final:renderFinal, interior:renderInterior, punch:renderPunch};
 
function reportFileBase(){
  return `KPS_${STATE.inspectionType}_${(STATE.header.property||'report').replace(/[^a-z0-9]+/gi,'_')}_${STATE.header.date||''}`;
}
 
/* Combined single PDF for local download — everything in one file, as before */
function generateReport(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const ctx = makeDocContext(doc);
  renderHeaderBlock(doc, ctx);
  const renderer = ENTITY_RENDERERS[STATE.inspectionType];
  const entities = STATE.inspectionType==='interior' ? STATE.units : STATE.buildings;
  entities.forEach((entity,i)=>{
    const label = entity.name || (STATE.inspectionType==='interior' ? `Unit ${i+1}` : `Building ${i+1}`);
    renderer(doc, ctx, entity, label);
  });
  doc.save(reportFileBase()+'.pdf');
  showToast('Report downloaded.');
}
 
/* Single PDF for exactly one building/unit — used for the OneDrive per-building upload */
function buildEntityPdfBlob(entity, label){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const ctx = makeDocContext(doc);
  renderHeaderBlock(doc, ctx);
  ENTITY_RENDERERS[STATE.inspectionType](doc, ctx, entity, label);
  return doc.output('blob');
}
function collectEntityPhotos(entity){
  const photos=[];
  if(STATE.inspectionType==='interior'){
    photos.push(...entity.ceilingPhotos);
    entity.stains.forEach(s=>photos.push(...s.photos));
  } else if(STATE.inspectionType==='punch'){
    entity.items.forEach(it=>photos.push(...it.photos));
  } else {
    Object.values(entity.sides).forEach(s=>photos.push(...s.photos));
    if(STATE.inspectionType==='exterior'){
      photos.push(...entity.acPhotos);
      if(STATE.subType==='decks'){ photos.push(...entity.sliderPhotos, ...entity.grillPhotos); }
      else { photos.push(...entity.rippedPhotos); }
      photos.push(...entity.damagePhotos);
    }
    if(STATE.inspectionType==='daily'){ photos.push(...entity.rotPhotos); }
  }
  return photos;
}
</script>
<script>
/* ---------------- MICROSOFT GRAPH / ONEDRIVE INTEGRATION ---------------- */
let msalInstance = null;
let graphAccount = null;
 
function initMsal(){
  if(typeof msal==='undefined'){
    console.error('MSAL library did not load — check network/CDN access.');
    return;
  }
  try{
    msalInstance = new msal.PublicClientApplication({
      auth:{
        clientId:'bf2fe5ed-142a-4a55-ae6f-e8ed5a181dd0',
        authority:'https://login.microsoftonline.com/1979066b-105d-423c-9941-42fcd5ac0752',
        redirectUri: window.location.origin + window.location.pathname
      },
      cache:{ cacheLocation:'memoryStorage' } // kept in memory only, never localStorage/sessionStorage
    });
    const existing = msalInstance.getAllAccounts()[0];
    if(existing){ graphAccount = existing; msalInstance.setActiveAccount(existing); }
  }catch(e){ console.error('MSAL init failed', e); }
}
 
const GRAPH_SCOPES = ['User.Read','Files.ReadWrite'];
 
async function signInMsGraph(){
  if(!msalInstance){ showToast('Microsoft sign-in is not available.'); return; }
  try{
    const resp = await msalInstance.loginPopup({scopes:GRAPH_SCOPES});
    graphAccount = resp.account;
    msalInstance.setActiveAccount(graphAccount);
    showToast('Signed in as '+graphAccount.username);
    render();
  }catch(e){
    console.error(e);
    showToast('Microsoft sign-in failed or was cancelled.');
  }
}
async function getGraphToken(){
  const account = msalInstance.getActiveAccount();
  if(!account) throw new Error('not signed in');
  try{
    const res = await msalInstance.acquireTokenSilent({scopes:GRAPH_SCOPES, account});
    return res.accessToken;
  }catch(e){
    const res = await msalInstance.acquireTokenPopup({scopes:GRAPH_SCOPES});
    return res.accessToken;
  }
}
 
function sanitizeName(name){
  return String(name||'Untitled').replace(/[\\\/:*?"<>|#%]/g,'-').trim().slice(0,120) || 'Untitled';
}
 
async function graphFetch(url, token, options={}){
  const res = await fetch(url, {...options, headers:{...(options.headers||{}), Authorization:`Bearer ${token}`}});
  return res;
}
 
/* Create a folder under parentId if it doesn't already exist; return its item id */
async function ensureFolder(token, parentId, name){
  const clean = sanitizeName(name);
  const createRes = await graphFetch(
    `https://graph.microsoft.com/v1.0/me/drive/items/${parentId}/children`, token,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:clean, folder:{}, '@microsoft.graph.conflictBehavior':'fail'}) }
  );
  if(createRes.status===201){ const j = await createRes.json(); return j.id; }
  if(createRes.status===409){
    const listRes = await graphFetch(
      `https://graph.microsoft.com/v1.0/me/drive/items/${parentId}/children?$select=id,name`, token
    );
    const listJ = await listRes.json();
    const match = (listJ.value||[]).find(it=>it.name.toLowerCase()===clean.toLowerCase());
    if(match) return match.id;
  }
  throw new Error('Could not create/find folder "'+clean+'" ('+createRes.status+')');
}
async function ensurePath(token, segments){
  let parentId = 'root';
  for(const seg of segments){ parentId = await ensureFolder(token, parentId, seg); }
  return parentId;
}
 
function dataURLtoBlob(dataurl){
  const arr = dataurl.split(',');
  const mimeMatch = arr[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const bstr = atob(arr[1]);
  let n = bstr.length; const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n]=bstr.charCodeAt(n); }
  return new Blob([u8arr], {type:mime});
}
 
/* Upload a file into a folder. Simple PUT for <4MB, resumable upload session above that. */
async function uploadFile(token, parentId, filename, blob){
  const clean = sanitizeName(filename);
  if(blob.size <= 4*1024*1024){
    const res = await graphFetch(
      `https://graph.microsoft.com/v1.0/me/drive/items/${parentId}:/${encodeURIComponent(clean)}:/content`,
      token, { method:'PUT', headers:{'Content-Type': blob.type||'application/octet-stream'}, body: blob }
    );
    if(!res.ok) throw new Error('Upload failed for '+clean+' ('+res.status+')');
    return;
  }
  // resumable upload session for larger files (combined PDFs with many photos)
  const sessionRes = await graphFetch(
    `https://graph.microsoft.com/v1.0/me/drive/items/${parentId}:/${encodeURIComponent(clean)}:/createUploadSession`,
    token, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}}) }
  );
  if(!sessionRes.ok) throw new Error('Could not start upload session for '+clean);
  const session = await sessionRes.json();
  const chunkSize = 5*1024*1024;
  let start = 0;
  while(start < blob.size){
    const end = Math.min(start+chunkSize, blob.size);
    const chunk = blob.slice(start, end);
    const putRes = await fetch(session.uploadUrl, {
      method:'PUT',
      headers:{'Content-Length':String(end-start), 'Content-Range':`bytes ${start}-${end-1}/${blob.size}`},
      body: chunk
    });
    if(!putRes.ok && putRes.status!==202) throw new Error('Chunk upload failed for '+clean);
    start = end;
  }
}
 
async function saveToOneDrive(){
  if(!msalInstance){ showToast('Microsoft sign-in is not available.'); return; }
  if(!msalInstance.getActiveAccount()){ await signInMsGraph(); if(!msalInstance.getActiveAccount()) return; }
 
  const entities = STATE.inspectionType==='interior' ? STATE.units : STATE.buildings;
  if(entities.length===0){ showToast('Add at least one building/unit first.'); return; }
 
  showToast('Uploading to OneDrive…');
  try{
    const token = await getGraphToken();
    const typeLabel = INSPECTION_TYPES.find(t=>t.key===STATE.inspectionType).label;
    const propertyFolderId = await ensurePath(token, ['KPS Field Reports', typeLabel, STATE.header.property||'Unnamed Property']);
 
    for(let i=0;i<entities.length;i++){
      const entity = entities[i];
      const label = entity.name || (STATE.inspectionType==='interior' ? `Unit ${i+1}` : `Building ${i+1}`);
      const entityFolderId = await ensureFolder(token, propertyFolderId, label);
      const photosFolderId = await ensureFolder(token, entityFolderId, 'Photos');
 
      const pdfBlob = buildEntityPdfBlob(entity, label);
      await uploadFile(token, entityFolderId, sanitizeName(label)+'_Report.pdf', pdfBlob);
 
      const photos = collectEntityPhotos(entity);
      for(let p=0;p<photos.length;p++){
        const blob = dataURLtoBlob(photos[p]);
        await uploadFile(token, photosFolderId, `photo_${String(p+1).padStart(3,'0')}.jpg`, blob);
      }
    }
    showToast('Saved to OneDrive: KPS Field Reports / '+typeLabel+' / '+(STATE.header.property||'Unnamed Property'));
  }catch(e){
    console.error(e);
    showToast('OneDrive upload failed — check connection and try again.');
  }
}
 
initMsal();
</script>
<script>
render();
</script>
